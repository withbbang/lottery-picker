spring:
  application:
    name: lottery-picker-api
  profiles:
    default: local
  jpa:
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  dhlottery:
    base-url: https://www.dhlottery.co.kr
    min-interval-ms: 500
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
