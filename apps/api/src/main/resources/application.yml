spring:
  application:
    name: lottery-picker-api
  profiles:
    default: local
  jpa:
    open-in-view: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  task:
    scheduling:
      pool:
        size: 2

app:
  auth:
    enabled: true
    totp-secret: ${TOTP_SECRET:}
    cookie-secure: true
  dhlottery:
    base-url: https://www.dhlottery.co.kr
    min-interval-ms: 2000
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
