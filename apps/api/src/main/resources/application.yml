spring:
  application:
    name: lottery-picker-api
  profiles:
    default: local
  jpa:
    open-in-view: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  task:
    scheduling:
      pool:
        size: 2

app:
  auth:
    enabled: true
    totp-secret: ${TOTP_SECRET:}
    cookie-secure: true
  dhlottery:
    base-url: https://www.dhlottery.co.kr
    min-interval-ms: 2000
  telegram:
    base-url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    family-chat-id: ${TELEGRAM_FAMILY_CHAT_ID:}
    retry-delay-ms: 5000
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
